name: pytest

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: geonatadmin
          POSTGRES_PASSWORD: geonatadmin
          POSTGRES_DB: geonature2db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
        sqlalchemy-version: ["2.0"]
        include:
          - sqlalchemy-version: "2.0"
            sqlalchemy-lt-version: "3.0"
            flask-sqlalchemy-version: "3.0"
            flask-sqlalchemy-lt-version: "3.1"
            flask-version: "2.2"
            flask-lt-version: "4.0"

    name: Python ${{ matrix.python-version }} - SQLAlchemy ${{ matrix.sqlalchemy-version }}

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[tests] pytest-cov
      - name: Test with pytest
        run: |
          pytest -v --cov --cov-report xml

      - name: Upload coverage to Codecov
        if: ${{ matrix.python-version == '3.13'}}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: pytest
